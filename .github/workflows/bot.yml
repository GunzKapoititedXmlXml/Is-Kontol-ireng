name: Bot Auto Restart 24/7

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 359

    steps:
      - uses: actions/checkout@v4

      # ==========================================================
      #  📦 INSTALL SYSTEM DEPENDENCIES
      # ==========================================================
      - name: Install Dependencies
        run: |
          echo "=========================================="
          echo "📦 INSTALLING SYSTEM DEPENDENCIES"
          echo "=========================================="

          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            curl \
            wget \
            git \
            unzip \
            unrar-free \
            p7zip-full \
            screen \
            jq \
            nano \
            tree

          echo "✅ Dependencies installed"

      # ==========================================================
      #  🐘 INSTALL PHP
      # ==========================================================
      - name: Install PHP
        run: |
          echo "=========================================="
          echo "🐘 INSTALLING PHP"
          echo "=========================================="

          sudo apt-get install -y -qq \
            php-cli \
            php-cgi \
            php-curl \
            php-mbstring \
            php-xml \
            php-json \
            php-zip \
            php-gd \
            php-sqlite3

          echo ""
          echo "✅ PHP installed:"
          php -v
          echo ""
          echo "✅ PHP-CGI location:"
          which php-cgi || echo "php-cgi tidak ada, pakai php CLI"
          echo ""
          echo "✅ PHP extensions:"
          php -m

      # ==========================================================
      #  ☁️ INSTALL CLOUDFLARED
      # ==========================================================
      - name: Install Cloudflared with Token
        env:
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
        run: |
          echo "=========================================="
          echo "☁️ INSTALLING CLOUDFLARED"
          echo "=========================================="

          wget -q -O cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

          cloudflared --version

          if [ -z "$CLOUDFLARE_TOKEN" ]; then
            echo "⚠️ CLOUDFLARE_TOKEN secret tidak diset, skip tunnel"
          else
            echo "Starting Cloudflared tunnel..."
            nohup cloudflared tunnel run --token "$CLOUDFLARE_TOKEN" > /tmp/cloudflared.log 2>&1 &
            sleep 3
            if pgrep -f "cloudflared" > /dev/null; then
              echo "✅ Cloudflared tunnel running"
            else
              echo "⚠️ Cloudflared gagal start, cek log:"
              cat /tmp/cloudflared.log
            fi
          fi

      # ==========================================================
      #  📦 EXTRACT BOT FILES
      # ==========================================================
      - name: Unzip and Setup Bot Files
        run: |
          echo "=========================================="
          echo "📦 EXTRACTING ARCHIVE FILES"
          echo "=========================================="

          echo "Files before extraction:"
          ls -la
          echo ""

          shopt -s nullglob

          # Extract .zip
          for zipfile in *.zip; do
            if [ -f "$zipfile" ]; then
              echo "📦 Extracting: $zipfile"
              unzip -o "$zipfile"
              if [ $? -eq 0 ]; then
                echo "✅ Successfully extracted: $zipfile"
                rm -f "$zipfile"
              else
                echo "❌ Failed to extract: $zipfile"
              fi
              echo ""
            fi
          done

          # Extract .rar
          for rarfile in *.rar; do
            if [ -f "$rarfile" ]; then
              echo "📦 Extracting: $rarfile"
              if command -v unrar > /dev/null 2>&1; then
                unrar x -o+ "$rarfile"
              elif command -v 7z > /dev/null 2>&1; then
                7z x "$rarfile" -y
              else
                echo "⚠️ Tidak ada unrar/7z, skip"
                continue
              fi
              if [ $? -eq 0 ]; then
                echo "✅ Successfully extracted: $rarfile"
                rm -f "$rarfile"
              fi
              echo ""
            fi
          done

          # Extract .7z
          for sevenzfile in *.7z; do
            if [ -f "$sevenzfile" ]; then
              echo "📦 Extracting: $sevenzfile"
              7z x "$sevenzfile" -y
              if [ $? -eq 0 ]; then
                echo "✅ Successfully extracted: $sevenzfile"
                rm -f "$sevenzfile"
              fi
              echo ""
            fi
          done

          shopt -u nullglob

          echo "=========================================="
          echo "📁 FILES AFTER EXTRACTION:"
          echo "=========================================="
          ls -la
          echo ""

          echo "🌳 Directory tree (depth 3, tanpa node_modules):"
          tree -L 3 -I 'node_modules|.git|vendor' || ls -R
          echo ""

          echo "📄 Found package.json files:"
          find . -name "package.json" -type f -not -path "*/node_modules/*"
          echo ""

          echo "📄 Found composer.json files:"
          find . -name "composer.json" -type f -not -path "*/vendor/*"
          echo ""

          echo "📄 Found .js files (entry point candidates):"
          find . -name "*.js" -type f -not -path "*/node_modules/*" -not -path "*/vendor/*" | head -50
          echo ""

      # ==========================================================
      #  🟢 INSTALL NODE.JS
      # ==========================================================
      - name: Setup Node.js 25
        uses: actions/setup-node@v4
        with:
          node-version: '25'

      - name: Install Node Dependencies
        run: |
          echo "=========================================="
          echo "🟢 INSTALLING NODE DEPENDENCIES"
          echo "=========================================="

          if [ -f "package.json" ]; then
            echo "📦 Found package.json in root, installing..."
            npm install --no-audit --no-fund 2>&1 | tail -30
            echo "✅ Root dependencies installed"
          fi

          shopt -s nullglob
          for dir in */; do
            if [ -f "${dir}package.json" ]; then
              echo ""
              echo "📦 Installing in: $dir"
              cd "$dir"
              npm install --no-audit --no-fund 2>&1 | tail -30
              cd ..
              echo "✅ Dependencies installed in $dir"
            fi
          done
          shopt -u nullglob

          echo ""
          echo "✅ All node dependencies installed"

      # ==========================================================
      #  🎼 INSTALL COMPOSER
      # ==========================================================
      - name: Install PHP Composer Dependencies
        run: |
          echo "=========================================="
          echo "🎼 INSTALLING COMPOSER DEPENDENCIES"
          echo "=========================================="

          if [ -f "composer.json" ]; then
            echo "📦 Found composer.json in root, installing..."

            if ! command -v composer > /dev/null 2>&1; then
              echo "📥 Installing Composer..."
              curl -sS https://getcomposer.org/installer | php
              sudo mv composer.phar /usr/local/bin/composer
              sudo chmod +x /usr/local/bin/composer
            fi

            composer install --no-interaction --no-progress --no-dev 2>&1 | tail -20
            echo "✅ Root composer dependencies installed"
          fi

          shopt -s nullglob
          for dir in */; do
            if [ -f "${dir}composer.json" ]; then
              echo "📦 Installing composer in: $dir"
              cd "$dir"

              if ! command -v composer > /dev/null 2>&1; then
                curl -sS https://getcomposer.org/installer | php
                sudo mv composer.phar /usr/local/bin/composer
                sudo chmod +x /usr/local/bin/composer
              fi

              composer install --no-interaction --no-progress --no-dev 2>&1 | tail -20
              cd ..
              echo "✅ Composer deps installed in $dir"
            fi
          done
          shopt -u nullglob

          echo ""
          echo "✅ All composer dependencies installed"

      # ==========================================================
      #  🚀 RUN ALL BOTS (MULTI-BOT PARALEL) — TANPA PAT
      # ==========================================================
      - name: Start All Bots with Auto Restart
        env:
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          PHP_BIN: php-cgi
        run: |
          echo "=========================================="
          echo "🚀 STARTING ALL BOTS (TANPA PAT)"
          echo "=========================================="
          echo "✅ Multi-bot paralel (1 screen per bot)"
          echo "✅ Auto restart on crash (per bot)"
          echo "✅ Console log real-time per bot"
          echo "✅ Restart via cron schedule tiap 6 jam"
          echo "✅ PHP: $(php -v | head -1)"
          echo "=========================================="

          cat > /tmp/token.env <<EOF
          export PHP_BIN='php-cgi'
          export CLOUDFLARE_TOKEN='$CLOUDFLARE_TOKEN'
          export PATH='/usr/bin:/usr/local/bin:\$PATH'
          EOF

          # ==================================================
          #  SCRIPT: FIND + START ALL BOTS (1 screen / bot)
          # ==================================================
          cat > start_all_bots.sh << 'BOTEOF'
          #!/bin/bash
          source /tmp/token.env

          # ---------- DISCOVERY ----------
          find_all_bots() {
            local -a BOTS=()

            # --- 1. File .js di root (skip helper) ---
            shopt -s nullglob
            for f in *.js; do
              [[ -f "$f" ]] || continue
              case "$f" in
                start_bot.js|start_all_bots.js|monitor.js|setup.js|config.js|webpack.config.js|.*) continue ;;
              esac
              if [[ -f package.json ]]; then
                MAIN=$(jq -r '.main // empty' package.json 2>/dev/null)
                if [[ -n "$MAIN" && "$MAIN" != "$f" ]]; then
                  continue
                fi
              fi
              LINES=$(wc -l < "$f" 2>/dev/null || echo 0)
              [[ "$LINES" -gt 5 ]] && BOTS+=("$(pwd)/$f")
            done
            shopt -u nullglob

            # --- 2. Subdirectory rekursif (max depth 4) ---
            while IFS= read -r pkg; do
              local dir
              dir=$(dirname "$pkg")
              local main
              main=$(jq -r '.main // empty' "$pkg" 2>/dev/null)
              if [[ -n "$main" && -f "$dir/$main" ]]; then
                BOTS+=("$dir/$main")
                continue
              fi
              for c in index.js app.js main.js server.js bot.js start.js; do
                if [[ -f "$dir/$c" ]]; then
                  BOTS+=("$dir/$c")
                  break
                fi
              done
            done < <(find . -maxdepth 4 -name package.json \
                      -not -path "*/node_modules/*" \
                      -not -path "*/.git/*" \
                      -not -path "*/vendor/*")

            # Dedupe
            printf '%s\n' "${BOTS[@]}" | sort -u
          }

          mapfile -t BOT_FILES < <(find_all_bots)

          echo "=========================================="
          echo "📋 Found ${#BOT_FILES[@]} bot(s):"
          echo "=========================================="
          for b in "${BOT_FILES[@]}"; do
            echo "  ✔️  $b"
          done
          echo "=========================================="

          if [[ ${#BOT_FILES[@]} -eq 0 ]]; then
            echo "❌ No bot files found!"
            echo "Files di root:"
            ls -la
            exit 1
          fi

          # ---------- START EACH BOT IN OWN SCREEN ----------
          for BOT_PATH in "${BOT_FILES[@]}"; do
            BOT_DIR=$(dirname "$BOT_PATH")
            BOT_FILE=$(basename "$BOT_PATH")

            BOT_NAME=$(echo "$BOT_DIR" | sed 's|^\./||; s|/|_|g')
            [[ -z "$BOT_NAME" || "$BOT_NAME" == "." ]] && BOT_NAME="root"
            SESSION="bot_${BOT_NAME}"

            if screen -list | grep -q "\.${SESSION}[[:space:]]"; then
              echo "⏭️  Session $SESSION already exists, skip"
              continue
            fi

            screen -dmS "$SESSION" bash -c "
              cd '$BOT_DIR'
              while true; do
                echo \"🚀 [\$(date '+%H:%M:%S')] Starting $BOT_FILE\"
                node '$BOT_FILE' 2>&1
                EXIT_CODE=\$?
                echo \"❌ [\$(date '+%H:%M:%S')] $BOT_FILE exited (code: \$EXIT_CODE), restart in 5s\"
                sleep 5
              done
            "
            echo "✅ Started $BOT_FILE in screen session: $SESSION"
          done

          echo ""
          echo "🎯 ${#BOT_FILES[@]} bot(s) launched in separate screens"
          BOTEOF

          chmod +x start_all_bots.sh

          # ==================================================
          #  SCRIPT: MONITOR
          # ==================================================
          cat > monitor.sh << 'MONITOREOF'
          #!/bin/bash
          source /tmp/token.env

          echo "=========================================="
          echo "👁️  MONITOR STARTED"
          echo "=========================================="

          while true; do
            sleep 60

            echo "[$(date)] 👁️  Monitor check"

            bash start_all_bots.sh > /tmp/start_bots.log 2>&1

            if ! pgrep -f "cloudflared" > /dev/null; then
              if [ -n "$CLOUDFLARE_TOKEN" ]; then
                echo "⚠️ [$(date)] Cloudflared died! Restarting..."
                nohup cloudflared tunnel run --token "$CLOUDFLARE_TOKEN" > /tmp/cloudflared.log 2>&1 &
              fi
            fi

            echo "   Screens:"
            screen -ls | grep -E "bot_|monitor" || echo "   (none)"
            echo "   Node procs : $(pgrep -f node | wc -l)"
            echo "   PHP        : $(php -v 2>/dev/null | head -1 || echo 'not found')"
          done
          MONITOREOF

          chmod +x monitor.sh

          # ==================================================
          #  LAUNCH
          # ==================================================
          echo "🖥️  Starting all bots..."
          bash start_all_bots.sh

          echo "🖥️  Starting monitor..."
          screen -dmS monitor bash monitor.sh

          sleep 5

          echo ""
          echo "=========================================="
          echo "✅ BOTS + MONITOR RUNNING"
          echo "=========================================="
          screen -ls
          echo ""

          # ==================================================
          #  MAIN LOOP — RUNTIME 5h 50m, RESTART VIA CRON
          # ==================================================
          START_TIME=$(date +%s)
          MAX_RUNTIME=$((5 * 3600 + 50 * 60))

          echo "📊 Main loop started — log tampil di sini"
          echo "⏰ Durasi: 5h 50m, selanjutnya di-handle cron '0 */6 * * *'"
          echo "=========================================="

          while true; do
            sleep 30

            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))
            REMAINING=$((MAX_RUNTIME - ELAPSED))

            echo ""
            echo "════════════════════════════════════════════"
            echo "⏱️  [$(date '+%Y-%m-%d %H:%M:%S')]"
            echo "   Runtime   : $((ELAPSED / 3600))h $(((ELAPSED % 3600) / 60))m $((ELAPSED % 60))s"
            echo "   Remaining : $((REMAINING / 3600))h $(((REMAINING % 3600) / 60))m $((REMAINING % 60))s"
            echo "════════════════════════════════════════════"

            # Dump tiap screen bot
            for sess in $(screen -ls | grep -oE 'bot_[a-zA-Z0-9_]+' | sort -u); do
              screen -S "$sess" -X hardcopy "/tmp/${sess}.log" 2>/dev/null
              if [ -f "/tmp/${sess}.log" ]; then
                echo "───── 📜 $sess (last 15 lines) ─────"
                tail -15 "/tmp/${sess}.log"
                echo "──────────────────────────────────────"
              fi
            done

            if ! pgrep -f "cloudflared" > /dev/null; then
              if [ -n "$CLOUDFLARE_TOKEN" ]; then
                echo "⚠️ Cloudflared died! Restarting..."
                nohup cloudflared tunnel run --token "$CLOUDFLARE_TOKEN" > /tmp/cloudflared.log 2>&1 &
              fi
            fi

            if [ $REMAINING -lt 60 ]; then
              echo ""
              echo "⏰ Time's up! Final console dump..."
              for sess in $(screen -ls | grep -oE 'bot_[a-zA-Z0-9_]+' | sort -u); do
                screen -S "$sess" -X hardcopy "/tmp/${sess}_final.log" 2>/dev/null
                echo "───── 📜 FINAL: $sess ─────"
                tail -50 "/tmp/${sess}_final.log" 2>/dev/null
              done
              echo "👋 Exiting. Run berikutnya akan di-trigger cron 6 jam."
              exit 0
            fi
          done
